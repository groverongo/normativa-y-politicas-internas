# Monorepo root compose: builds each module's own Dockerfile and loads that
# module's own .env file. Each module stays independent -- no shared network
# dependency between them beyond what's defined here.
#
#   ./docker-up.sh                 # build + start all modules + local db
#   ./docker-up.sh up --build api  # pass any args through to `docker compose`
#
# Host ports are overridable via INGESTA_PORT / NTTBANCA_PORT /
# NTTDATABANCA_PORT / DB_PORT env vars in case 8000/8001/8002/5433 are
# already taken on your machine.
#
# Local Postgres: both modules' .env files point DB_HOST at a remote AWS RDS
# instance by default. The `environment:` overrides below replace those with
# the local `db` service instead, so nothing here touches the real RDS.
# ingesta, nttbanca-n and nttdatabanca now share ONE database and ONE
# migration sequence (modules/nttbanca-n/migrations/, see its README) -- the
# `migrate` service below applies it once before any app starts.
#
# nttdatabanca also uses this same Postgres for vector search (pgvector,
# replacing its former Qdrant Cloud dependency -- see
# modules/nttbanca-n/migrations/0009_nttdatabanca_rag_support.sql), which is
# why the `db` image below is pgvector-enabled rather than plain postgres.

services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: nttbanca
      POSTGRES_USER: nttbanca
      POSTGRES_PASSWORD: nttbanca
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nttbanca -d nttbanca"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: ./modules/nttbanca-n
    image: nttbanca-api
    command: ["python", "-m", "app.db.migrate"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: nttbanca
      DB_USER: nttbanca
      DB_PASSWORD: nttbanca
      DB_SSLMODE: disable
      S3_BUCKET_NAME: unused
    depends_on:
      db:
        condition: service_healthy

  ingesta:
    build:
      context: ./modules/ingesta
    image: ingesta
    env_file:
      - ./modules/ingesta/.env
    environment:
      STORAGE_BACKEND: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: nttbanca
      DB_USER: nttbanca
      DB_PASSWORD: nttbanca
      DB_SSLMODE: disable
    ports:
      - "${INGESTA_PORT:-8000}:8000"
    volumes:
      - ./modules/ingesta/runs:/app/runs
    depends_on:
      migrate:
        condition: service_completed_successfully

  nttbanca-n:
    build:
      context: ./modules/nttbanca-n
    image: nttbanca-api
    env_file:
      - ./modules/nttbanca-n/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: nttbanca
      DB_USER: nttbanca
      DB_PASSWORD: nttbanca
      DB_SSLMODE: disable
    ports:
      - "${NTTBANCA_PORT:-8001}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  nttdatabanca:
    build:
      context: ./modules/nttdatabanca
      target: runtime
    image: nttdatabanca-api
    env_file:
      - ./modules/nttdatabanca/.env
    environment:
      REGISTRY_BACKEND: postgres
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: nttbanca
      DB_USER: nttbanca
      DB_PASSWORD: nttbanca
      DB_SSLMODE: disable
    ports:
      - "${NTTDATABANCA_PORT:-8002}:8080"
    volumes:
      - ./modules/nttdatabanca/registry.json:/app/registry.json
      - ./modules/nttdatabanca/evals.json:/app/evals.json:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
